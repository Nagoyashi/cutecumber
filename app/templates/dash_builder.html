<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>page builder · cutecumber.cc</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="preload" href="{{ url_for('static', filename='fonts/fredoka-latin-600-normal.woff2') }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ url_for('static', filename='dash.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='builder.css') }}">
<script src="{{ url_for('static', filename='builder.js') }}" defer></script>
</head>
<body class="builder-body">
<div id="builder"
     data-draft="{{ draft_json }}"
     data-csrf="{{ csrf_token() }}"
     data-plan="{{ plan }}"
     data-username="{{ username }}"
     data-published="{{ '1' if is_published else '0' }}">
  <header class="b-top">
    <a class="b-brand" href="{{ url_for('dash.home') }}"><img src="{{ url_for('static', filename='favicon.svg') }}" alt="" width="26" height="26"><span>cutecumber</span></a>
    <span class="b-chip">builder</span>
    <span class="b-url">cutecumber.cc/{{ username }}</span>
    <div class="b-top-right">
      <button type="button" class="b-toggle" id="b-phone" aria-pressed="false">📱 phone</button>
      <span class="b-save" id="b-save" aria-live="polite"></span>
      <button type="button" class="pill b-publish" id="b-publish">publish</button>
    </div>
  </header>
  <div class="b-main">
    <section class="b-canvas" aria-label="live preview">
      <div class="b-frame" id="b-frame">
        <div class="b-frame-bar" aria-hidden="true"><span></span><span></span><span></span><em>cutecumber.cc/{{ username }}</em></div>
        <iframe id="b-preview" title="live preview of your page" src="{{ url_for('builder.preview') }}"></iframe>
      </div>
    </section>
    <aside class="b-rail">
      <div class="b-panel">
        <h2 class="b-h">sections</h2>
        <ol class="b-sections" id="b-sections"></ol>
        <button type="button" class="b-add" id="b-add">+ add a section</button>
      </div>
      <div class="b-panel b-inspector" id="b-inspector"></div>
    </aside>
  </div>
  <div class="b-drawer" id="b-drawer" hidden>
    <div class="b-drawer-card" role="dialog" aria-label="add a section">
      <div class="b-drawer-head"><strong>add a section</strong><button type="button" class="b-x" id="b-drawer-x" aria-label="close">✕</button></div>
      <p class="b-drawer-sub">every style is pre-arranged to look good — just fill it with you.</p>
      <div class="b-drawer-grid" id="b-drawer-grid"></div>
    </div>
  </div>
  <noscript><p class="b-nojs-msg">the builder needs javascript — it's the one dash screen that does. your public page never will.</p></noscript>
</div>
</body>
</html>
